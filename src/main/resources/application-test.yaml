spring:
  jpa:
    hibernate:
        ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
        show_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: KAKAO_CLIENT_ID
            client-secret: KAKAO_CLIENT_SECRET
            redirect-uri: KAKAO_REDIRECT_URI
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - phone_number
              - gender
              - birthday
              - birthyear
          naver:
            client-id: NAVER_CLIENT_ID
            client-secret: NAVER_CLIENT_SECRET
            redirect-uri: NAVER_REDIRECT_URI
            authorization-grant-type: authorization_code
            client-name: Naver
            scope:
              - mobile
              - gender
              - birthyear
              - birthday
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  jwt:
    secret: "secretkeysecretkeysecretkeysecretkeysecretkeysecretkeysecretkey"

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      retries: 1
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: KAFKA_CONSUMER_GROUP_ID
      chat-group-id: KAFKA_CHAT_CONSUMER_GROUP_ID
      auto-offset-reset: earliest
      enable-auto-commit: false
    admin:
      properties:
        client.id: KAFKA_ADMIN_CLIENT_ID
    topics:
      chat-room: KAFKA_TOPIC_CHAT_ROOM
    partition-count: 1
    replication-factor: 1

logging:
  level:
    org:
      springframework:
        data:
          redis:
            core: DEBUG
            connection: TRACE
          mongodb:
            core:
              MongoTemplate : DEBUG
            repository:
              query : DEBUG

    com:
      mongodb : DEBUG

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 10s
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 0s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
    instances:
      circuit:
        base-config: default

websocket:
  allowed-origin: "http://localhost:3000"
