server:
  forward-headers-strategy: framework  # ALB HTTPS 헤더 인식

spring:
  application:
    name: twp-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}?useSSL=false&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&socketTimeout=60000&connectTimeout=60000
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # OCI 프록시 환경 최적화 HikariCP 설정
    hikari:
      connection-timeout: 60000          # OCI 네트워크 지연 고려 60초
      idle-timeout: 60000                # OCI 프록시가 빨리 끊으므로 1분
      max-lifetime: 180000               # OCI 프록시 정책 고려 3분
      keepalive-time: 30000
      maximum-pool-size: 8               # 채팅/실시간 서비스라 조금 더 큰 풀
      minimum-idle: 2                    # 최소 연결 수 증가
      validation-timeout: 10000          # 네트워크 지연 고려 10초
      leak-detection-threshold: 30000    # 30초로 단축
      connection-test-query: "SELECT 1"  # 연결 검증 쿼리
      auto-commit: false

  data:
    mongodb:
      read:
        uri: ${SPRING_DATA_MONGODB_READ_URI}&connectTimeoutMS=30000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxIdleTimeMS=60000
      chat:
        uri: ${SPRING_DATA_MONGODB_CHAT_URI}&connectTimeoutMS=30000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxIdleTimeMS=60000
      auto-index-creation: true

    # 클러스터 → 단일 Redis로 변경
    redis:
      host: ${REDIS_HOST}                # dev-redis-lock.dev-twp-service.svc.cluster.local
      port: ${REDIS_PORT:6379}           # 기본값 6379
      timeout: 5s
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          max-wait: 3s

  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate                 # update → validate (프로덕션 안전)
    show-sql: false                      # true → false (프로덕션 성능)
    open-in-view: false                  # 성능 개선을 위해 추가
    properties:
      hibernate.format_sql: false        # true → false (프로덕션)
      hibernate.show_sql: false          # true → false (프로덕션)
      hibernate.jdbc.time_zone: Asia/Seoul

      # OCI 환경에서 채팅 서비스 최적화
      hibernate.jdbc.batch_size: 10      # 1 → 10 (채팅 성능 향상)
      hibernate.order_inserts: true      # false → true (배치 최적화)
      hibernate.order_updates: true      # false → true (배치 최적화)
      hibernate.jdbc.batch_versioned_data: true

      # 성능 최적화
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false

  jwt:
    secret: ${JWT_SECRET}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      retries: ${KAFKA_PRODUCER_RETRIES}
      acks: ${KAFKA_PRODUCER_ACKS}
      properties:
        enable.idempotence: ${KAFKA_PRODUCER_ENABLE_IDEMPOTENCE}
        max.in.flight.requests.per.connection: ${KAFKA_PRODUCER_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      chat-group-id: ${KAFKA_CHAT_CONSUMER_GROUP_ID}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      enable-auto-commit: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT}
    admin:
      properties:
        client.id: ${KAFKA_ADMIN_CLIENT_ID}
    topics:
      chat-room: ${KAFKA_TOPIC_CHAT_ROOM}
    partition-count: ${KAFKA_PARTITION_COUNT}
    replication-factor: ${KAFKA_REPLICATION_FACTOR}

cloud:
  aws:
    credentials:
      access-key: ${STORAGE_ACCESS_KEY}
      secret-key: ${STORAGE_SECRET_KEY}
    s3:
      bucket: ${BUCKET_NAME}
      endpoint: ${BUCKET_ENDPOINT}

management:
  endpoints:
    web:
      exposure:
        include:
          - health           # 애플리케이션 상태 확인
          - info             # 애플리케이션 정보
          - prometheus       # 메트릭 데이터 노출
  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_REPOSITORY_DSN}
  environment: ${SENTRY_ENVIRONMENT}
  servername: ${SENTRY_SERVERNAME}
  repository-uri: ${SENTRY_REPOSITORY_URI}

logging:
  config: classpath:logback-spring.xml

slack:
  webhook-url: ${SLACK_WEBHOOK_URL}

feign:
  user:
    url: ${FEIGN_USER_URL}

springdoc:
  swagger-ui:
    with-credentials: true

websocket:
  allowed-origin: ${WEBSOCKET_ALLOWED_ORIGIN}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 70
        slow-call-duration-threshold: 10s   # 15s → 10s (채팅 응답성)
        permitted-number-of-calls-in-half-open-state: 3
        max-wait-duration-in-half-open-state: 0s
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s # 15s → 10s (빠른 복구)
      # 채팅 서비스 특화 설정
      chat-config:
        failure-rate-threshold: 40
        slow-call-duration-threshold: 5s
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 5s
    instances:
      database:
        base-config: default
      kafka:
        base-config: chat-config # 카프카는 채팅 설정 사용
      user-service:
        base-config: default

  # 채팅 서비스 Retry 설정 최적화
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.sql.SQLException
          - com.mysql.cj.jdbc.exceptions.CommunicationsException
          - java.net.SocketTimeoutException
      chat-config:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.kafka.KafkaException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
    instances:
      database:
        base-config: default
      kafka:
        base-config: chat-config
      user-service:
        base-config: default

  # 동시 요청 제어 (채팅 특화)
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 3s
      chat-config:
        max-concurrent-calls: 50        # 채팅은 더 많은 동시 요청 허용
        max-wait-duration: 1s
    instances:
      database:
        base-config: default
      kafka:
        base-config: chat-config
      user-service:
        base-config: default

  # 타임아웃 제어 (채팅 특화)
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
      chat-config:
        timeout-duration: 5s
    instances:
      database:
        base-config: default
      kafka:
        base-config: chat-config
      user-service:
        base-config: default
