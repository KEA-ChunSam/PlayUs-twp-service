spring:
  application:
    name: twp-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    mongodb:
      read:
        uri: ${MONGO_READ_URI}

      chat:
        uri: ${MONGO_CHAT_URI}

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jwt:
    secret: ${JWT_SECRET}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database: mysql
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
        show_sql: true
